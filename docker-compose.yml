services:
  postgres:
    image: postgres:16-alpine
    container_name: autolavado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-autolavado}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autolavado}
      POSTGRES_DB: ${DB_NAME:-autolavado}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autolavado} -d ${DB_NAME:-autolavado}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: autolavado-postgres-data
